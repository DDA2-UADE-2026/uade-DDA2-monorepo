name: Backend mutation testing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Record tested version
        run: |
          mkdir -p build/reports/mutation-context
          git rev-parse HEAD > build/reports/mutation-context/commit.txt
          java -version 2> build/reports/mutation-context/java.txt
          cp qa-mutation.init.gradle build/reports/mutation-context/
      - name: Verify domain validator tests
        run: bash gradlew test --tests '*validator.*Test' --no-configuration-cache --console=plain --max-workers=2
      - name: Mutation score must reach 60 percent
        run: |
          set -o pipefail
          bash gradlew -I qa-mutation.init.gradle pitest --no-configuration-cache --console=plain --max-workers=2 2>&1 | tee build/reports/mutation-context/execution.log
      - name: Preserve reports even if threshold fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-mutation-${{ github.sha }}
          path: |
            server/build/reports/pitest/
            server/build/reports/mutation-context/
            server/build/reports/tests/test/
          if-no-files-found: warn
          retention-days: 30
