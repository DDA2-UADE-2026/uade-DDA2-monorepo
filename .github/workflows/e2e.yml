name: E2E Playwright

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
    paths: ['client/**', 'server/**', 'scripts/testing/**', 'compose.e2e.yml', '.github/workflows/e2e.yml']
  push:
    branches: [main, develop, feature/backend-branch-coverage]
    paths: ['client/**', 'server/**', 'scripts/testing/**', 'compose.e2e.yml', '.github/workflows/e2e.yml']

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Start disposable database
        run: docker compose -f compose.e2e.yml up -d --wait
      - name: Build backend
        working-directory: server
        run: ./gradlew bootJar --no-daemon --console=plain
      - name: Install browser tests
        working-directory: client
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run five integrated browser journeys
        working-directory: client
        run: |
          npm run test:e2e:check
          npm run test:e2e
      - name: Preserve Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            client/playwright-report/
            client/test-results/
            client/e2e-server-logs/
          if-no-files-found: error
          retention-days: 14
      - name: Remove disposable database
        if: always()
        run: docker compose -f compose.e2e.yml down -v
