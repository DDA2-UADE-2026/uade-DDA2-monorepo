name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  publish-images:
    name: publish-images
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_branch == 'main' && 'latest' || 'develop' }}
      VITE_SERVER_URL: ${{ github.event.workflow_run.head_branch == 'main' && vars.PRODUCTION_SERVER_URL || vars.DEVELOP_SERVER_URL }}
      VITE_CLIENT_URL: ${{ github.event.workflow_run.head_branch == 'main' && vars.PRODUCTION_CLIENT_URL || vars.DEVELOP_CLIENT_URL }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push client image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/uade-dda2-client:${{ env.IMAGE_TAG }}
          platforms: linux/amd64
          build-args: |
            VITE_SERVER_URL=${{ env.VITE_SERVER_URL }}
            VITE_CLIENT_URL=${{ env.VITE_CLIENT_URL }}

      - name: Build and push server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/uade-dda2-server:${{ env.IMAGE_TAG }}
          platforms: linux/amd64
