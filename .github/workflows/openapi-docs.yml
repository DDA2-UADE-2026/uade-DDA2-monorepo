name: OpenAPI docs

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "server/**"
      - ".github/workflows/openapi-docs.yml"

permissions:
  contents: write

jobs:
  publish-docs:
    name: publish-docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Generate OpenAPI spec
        working-directory: server
        run: ./gradlew generateOpenApiDocs --no-daemon

      - name: Render Redoc page
        run: |
          mkdir -p "docs-site/${{ github.ref_name }}"
          npx -y @redocly/cli@latest build-docs server/build/openapi/openapi.json \
            --output="docs-site/${{ github.ref_name }}/index.html" \
            --title "Municipalidad UADE API (${{ github.ref_name }})"

      - name: Build landing page
        run: |
          cat > docs-site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="utf-8" />
            <title>Municipalidad UADE API docs</title>
          </head>
          <body>
            <h1>Municipalidad UADE &mdash; API docs</h1>
            <ul>
              <li><a href="./main/">main (prod)</a></li>
              <li><a href="./develop/">develop</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs-site
          destination_dir: .
          keep_files: true
