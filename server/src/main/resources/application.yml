# MODIFICA LAS REGLAS BOLUDO
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: social-development-api
  rabbitmq:
    host: ${CORE_AMQP_HOST:core-uade-2026.duckdns.org}
    port: ${CORE_AMQP_PORT:5671}
    virtual-host: ${CORE_AMQP_VHOST:core}
    username: ${CORE_AMQP_USERNAME:}
    password: ${CORE_AMQP_PASSWORD:}
    dynamic: false
    ssl:
      enabled: ${CORE_AMQP_TLS:true}
      validate-server-certificate: true
      verify-hostname: true
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      retry:
        enabled: false
    listener:
      simple:
        acknowledge-mode: manual
        auto-startup: false
        default-requeue-rejected: false
        retry:
          enabled: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
  jackson:
    mapper:
      accept-case-insensitive-enums: true
  servlet:
    multipart:
      max-file-size:
        ${MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size:
        ${MULTIPART_MAX_REQUEST_SIZE:11MB}
  jpa:
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
springdoc:
  show-actuator: true
  show-login-endpoint: true
  show-oauth2-endpoints: true
  api-docs:
    enabled: true
    path: ${API_DOCS_PATH:/api-docs}
  swagger-ui:
    enabled: true
    path: ${SWAGGER_UI_PATH:/swagger-ui}
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
app:
  core:
    enabled: ${CORE_ENABLED:false}
    check-on-startup: ${CORE_AMQP_CHECK_ON_STARTUP:false}
    module: desarrollo-social
    api-base-url: ${CORE_API_BASE_URL:https://core-uade-2026.duckdns.org/api/v1}
    machine-secret: ${CORE_MACHINE_SECRET:}
    queue: ${CORE_QUEUE:q.desarrollo-social}
    connect-timeout: ${CORE_CONNECT_TIMEOUT:5s}
    read-timeout: ${CORE_READ_TIMEOUT:10s}
    publisher:
      enabled: ${CORE_PUBLISHER_ENABLED:false}
      poll-interval: ${CORE_OUTBOX_POLL_INTERVAL:5s}
      batch-size: ${CORE_OUTBOX_BATCH_SIZE:20}
      confirm-timeout: ${CORE_CONFIRM_TIMEOUT:10s}
      lease-duration: ${CORE_OUTBOX_LEASE_DURATION:60s}
      retry-delay: ${CORE_OUTBOX_RETRY_DELAY:5s}
      max-retry-delay: ${CORE_OUTBOX_MAX_RETRY_DELAY:5m}
    consumer:
      enabled: ${CORE_CONSUMER_ENABLED:false}
      prefetch: ${CORE_CONSUMER_PREFETCH:1}
    probe:
      enabled: ${CORE_PROBE_ENABLED:false}
      event-type: ${CORE_PROBE_EVENT_TYPE:socialCoreConnectivityProbe}
      run-id: ${CORE_PROBE_RUN_ID:}
  bootstrap:
    admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:true}
  security:
    cookie:
      secure: ${AUTH_COOKIE_SECURE:false}
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
    jwt:
      issuer: ${JWT_ISSUER:example-issuer}
      secret: ${JWT_SECRET}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:28800}
      role-selection-expiration-seconds: ${JWT_ROLE_SELECTION_EXPIRATION_SECONDS:300}
  cors:
    allowed-origins:
      - ${CORS_ALLOWED_ORIGIN_1:http://localhost:5173}
      - ${CORS_ALLOWED_ORIGIN_2:http://127.0.0.1:5173}
      - ${CORS_ALLOWED_ORIGIN_3:}
      - ${CORS_ALLOWED_ORIGIN_4:}
  enrollment-period:
    expiration:
      cron: "${ENROLLMENT_PERIOD_EXPIRATION_CRON:0 5 0 * * *}"
      zone-id: ${ENROLLMENT_PERIOD_TIME_ZONE:America/Argentina/Buenos_Aires}
  benefit-grant:
    expiration:
      enabled: ${BENEFIT_GRANT_EXPIRATION_ENABLED:true}
      cron: "${BENEFIT_GRANT_EXPIRATION_CRON:0 */5 * * * *}"
      batch-size: ${BENEFIT_GRANT_EXPIRATION_BATCH_SIZE:100}
  appointment:
    zone-id: ${APPOINTMENT_TIME_ZONE:America/Argentina/Buenos_Aires}
