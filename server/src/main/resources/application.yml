server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: social-development-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/db_template}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
  jpa:
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  security:
    jwt:
      issuer: ${JWT_ISSUER:example-issuer}
      secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-32chars}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:28800}
  cors:
    allowed-origins:
      - ${CORS_ALLOWED_ORIGIN_1:http://localhost:3000}
      - ${CORS_ALLOWED_ORIGIN_2:http://127.0.0.1:3000}
