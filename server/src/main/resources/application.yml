server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: social-development-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
  jackson:
    mapper:
      accept-case-insensitive-enums: true
  servlet:
    multipart:
      max-file-size:
        ${MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size:
        ${MULTIPART_MAX_REQUEST_SIZE:10MB}
  jpa:
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
springdoc:
  show-actuator: true
  show-login-endpoint: true
  show-oauth2-endpoints: true
  api-docs:
    enabled: true
    path: ${API_DOCS_PATH:/api-docs}
  swagger-ui:
    enabled: true
    path: ${SWAGGER_UI_PATH:/swagger-ui}
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
app:
  security:
    jwt:
      issuer: ${JWT_ISSUER:example-issuer}
      secret: ${JWT_SECRET}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:28800}
      role-selection-expiration-seconds: ${JWT_ROLE_SELECTION_EXPIRATION_SECONDS:300}
  cors:
    allowed-origins:
      - ${CORS_ALLOWED_ORIGIN_1:http://localhost:3000}
      - ${CORS_ALLOWED_ORIGIN_2:http://127.0.0.1:3000}
      - ${CORS_ALLOWED_ORIGIN_3:}
      - ${CORS_ALLOWED_ORIGIN_4:}
  enrollment-period:
    expiration:
      cron: "${ENROLLMENT_PERIOD_EXPIRATION_CRON:0 5 0 * * *}"
      zone-id: ${ENROLLMENT_PERIOD_TIME_ZONE:America/Argentina/Buenos_Aires}
