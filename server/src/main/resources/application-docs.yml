spring:
  datasource:
    url: jdbc:h2:mem:docsdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
app:
  security:
    jwt:
      # Only for the isolated documentation/test profile, never for a deployment.
      secret: docs-only-jwt-signing-key-never-use-in-production
