listeners.tcp = none
listeners.ssl.default = 5671
ssl_options.cacertfile = /run/local-secrets/ca.crt
ssl_options.certfile = /run/local-secrets/tls.crt
ssl_options.keyfile = /run/local-secrets/tls.key
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false
management.load_definitions = /run/local-secrets/definitions.json
