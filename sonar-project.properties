sonar.projectKey=DDA2-UADE-2026_uade-DDA2-monorepo
sonar.organization=dda2-uade-2026
sonar.projectName=uade-DDA2-monorepo

# SonarCloud's current analysis scope scans the whole project; keep test code
# out of the coverage denominator without excluding it from issue analysis.
# infra/**/test_*.py are the unittest suites for the local Docker setup.
sonar.coverage.exclusions=server/src/test/**/*,infra/**/test_*.py

sonar.exclusions=**/coverage/**,**/build/**,**/node_modules/**,**/dist/**,client/src/**/*.test.ts,client/src/**/*.test.tsx,client/src/**/*.spec.ts,client/src/**/*.spec.tsx,client/src/**/*.d.ts,client/src/test/**,client/src/generated/**,client/src/routeTree.gen.ts

sonar.javascript.lcov.reportPaths=client/coverage/lcov.info
sonar.coverage.jacoco.xmlReportPaths=server/build/reports/qa-coverage/coverage.xml
sonar.java.binaries=server/build/classes/kotlin/main

# Ignore "Promises should not be left unhandled" in the client: TanStack APIs
# (invalidateQueries, navigate, form.handleSubmit) return promises that are
# intentionally fire-and-forget.
# Ignore docker:S6471 only on infra/local/init/Dockerfile: this local one-shot
# initializer intentionally runs as root to chown private secret volumes to
# distinct non-root service UIDs (10001:10001 and 10002:10002) before exiting.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S9383
sonar.issue.ignore.multicriteria.e1.resourceKey=client/**/*
sonar.issue.ignore.multicriteria.e2.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.e2.resourceKey=infra/local/init/Dockerfile
