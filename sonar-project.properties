sonar.projectKey=DDA2-UADE-2026_uade-DDA2-monorepo
sonar.organization=dda2-uade-2026
sonar.projectName=uade-DDA2-monorepo

# The current SonarQube Cloud scope UX ignores sonar.sources, sonar.tests, and
# sonar.test.inclusions. Keep generated reports and build outputs out of the
# default whole-repository scope instead.
sonar.exclusions=**/coverage/**,**/build/**,**/node_modules/**,**/dist/**,client/src/**/*.test.ts,client/src/**/*.test.tsx,client/src/**/*.spec.ts,client/src/**/*.spec.tsx,client/src/**/*.d.ts,client/src/generated/**,client/src/routeTree.gen.ts

sonar.javascript.lcov.reportPaths=client/coverage/lcov.info
sonar.coverage.jacoco.xmlReportPaths=server/build/reports/qa-coverage/coverage.xml
sonar.java.binaries=server/build/classes/kotlin/main
